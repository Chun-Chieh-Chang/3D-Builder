name: Repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:rules
      - run: npm run lint:deps
      - run: npm run lint:i18n
      - run: npm run lint:repo
      - name: Repository contracts and native geometry smoke checks
        run: npm test -- tests/phase5/repository-maintenance.test.ts tests/phase5/verify-ui-args.test.ts tests/phase8/context-menus.test.ts tests/phase8/view-normal.test.ts packages/sketch/test/solve-options.test.ts apps/web/test/sketcher.test.ts tests/phase3/entrance-tool.test.ts tests/phase5/drawing-component-hatch.test.ts tests/phase5/drawing-view-caption.test.ts tests/phase5/drawing-dimension-modes.test.ts tests/phase5/drawing-cone-chamfer.test.ts tests/phase5/drawing-projection-refs.test.ts tests/phase5/drawing-hole-depth.test.ts tests/phase5/drawing-annotations.test.ts tests/phase5/acceptance-5.test.ts packages/model/test/model.test.ts packages/kernel/test/bodies.test.ts
      # a wall-clock gate (p95 <= 8 ms) measures the controller only when nothing else competes for the cores: run beside the other files on a 2-4 core runner it failed on
      # all three systems (8.2 / 10.8 / 19.9 ms) while it takes 0.4 ms alone, even pinned to one core (DEV_LOG 2026-10-30). The threshold is unchanged.
      - name: Pointer baseline, alone
        run: npm test -- --no-file-parallelism apps/web/test/sketch-pointer-baseline.test.ts
      - run: npm run build
