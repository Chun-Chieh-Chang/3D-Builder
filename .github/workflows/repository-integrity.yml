name: Repository integrity

on:
  # a branch is checked by its pull request; a push of it as well would run everything twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full unit suite (C1: PRs keep the fast selected list; the whole suite runs once a day).
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # about 2 min on each platform (2026-11-14); a hung job is stopped here, not at GitHub's 6 h
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:rules
      - run: npm run lint:deps
      - run: npm run lint:i18n
      - run: npm run lint:repo
      - name: Headless CAD protocol, geometry benchmarks and manufacturing outputs
        run: npm test -- apps/mcp/test --maxWorkers 1
      - name: Repository contracts and native geometry smoke checks
        run: npm test -- tests/phase5/repository-maintenance.test.ts tests/phase5/verify-ui-args.test.ts tests/phase8/context-menus.test.ts tests/phase8/view-normal.test.ts packages/sketch/test/solve-options.test.ts packages/sketch/test/solver-memory.test.ts packages/sketch/test/budget-guard.test.ts apps/web/test/sketcher.test.ts tests/phase3/entrance-tool.test.ts tests/phase5/drawing-component-hatch.test.ts tests/phase5/drawing-view-caption.test.ts tests/phase5/drawing-dimension-modes.test.ts tests/phase5/drawing-cone-chamfer.test.ts tests/phase5/drawing-projection-refs.test.ts tests/phase5/drawing-hole-depth.test.ts tests/phase5/drawing-annotations.test.ts tests/phase5/acceptance-5.test.ts packages/model/test/model.test.ts packages/kernel/test/bodies.test.ts apps/web/test/browser-projects.test.ts packages/io/test/package.test.ts
      # a wall-clock gate (p95 <= 8 ms) measures the controller only when nothing else competes for the cores: run beside the other files on a 2-4 core runner it failed on
      # all three systems (8.2 / 10.8 / 19.9 ms) while it takes 0.4 ms alone, even pinned to one core (DEV_LOG 2026-10-30). The threshold is unchanged.
      - name: Pointer baseline, alone
        run: npm test -- --no-file-parallelism apps/web/test/sketch-pointer-baseline.test.ts
      # On Linux the build is the one GitHub Pages serves, under /<repository>/ (ADR 0233): the site is built once, here, and deployed below only
      # after every check on every system has passed.
      - run: npm run build
        env:
          PAGES_BASE: ${{ matrix.os == 'ubuntu-latest' && format('/{0}/', github.event.repository.name) || '' }}
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy-pages:
    needs: integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time; a newer push replaces one still waiting
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The whole suite on one runner took 59 min by #202 (2026-11-14; 7087 s of file time over two workers, most of it
  # the fuzz files added since 2026-11-10). Split it over SHARDS runners instead: no threshold, timeout or file is changed.
  # The split is by measured file time (vitest.config.ts DurationSequencer, scripts/test-shards.ts; the times are
  # scripts/test-durations.json, updated with `node scripts/test-durations.mjs <run id>`), not vitest's path hash: by hash
  # the shards held 381 to 1501 s of file time (run 43561427221), by time 882 s each. 2 workers a shard: 4 timed out
  # three heavy tests (run 43565198967, DEV_LOG 2026-11-14).
  full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # the slowest shard took 22.7 min with npm ci (run 43549138821) and 15.1 (43561427221); a hung shard, or one that
    # runs the whole suite (run 43563208784: a missing space dropped --shard), is stopped here, not at GitHub's 6 h
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      # what the runner has, so that worker counts are chosen from a measurement and not from memory
      - name: Runner cores and memory
        run: |
          echo "nproc: $(nproc)"
          node -e "const os = require('node:os'); console.log('availableParallelism:', os.availableParallelism(), 'cpus:', os.cpus().length, os.cpus()[0].model)"
          lscpu | grep -E '^(Thread|Core|Socket)'
          free -m
      - id: install
        run: npm ci
      # the log names the split ("shard i/n by measured time: ...") and any file without a measured time
      - name: Full unit suite (nightly, shard ${{ matrix.shard }})
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --maxWorkers 2 --shard=${{ matrix.shard }}/${{ env.SHARDS }} --exclude tests/phase6/section-offset-cost.test.ts

  # This cost probe measures OCCT wall time. It runs alone, on a runner of its own, so nothing competes with it
  # (it ran first in shard 1, which made that shard 160 s longer than the others).
  section-offset-cost:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Section offset cost, alone
        run: npm test -- --no-file-parallelism tests/phase6/section-offset-cost.test.ts
