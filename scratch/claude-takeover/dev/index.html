<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEP 35/35 可編輯特徵化｜開發進度</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mute:#8b949e;--ok:#3fb950;--run:#58a6ff;--warn:#d29922;--bad:#f85149;--wait:#6e7681;--appr:#a371f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--mute);font-size:13px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px}
  main{display:grid;grid-template-columns:380px 1fr;gap:20px;padding:20px 28px;max-width:1440px;margin:0 auto}
  .col{display:flex;flex-direction:column;gap:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .panel h2{font-size:13px;letter-spacing:.04em;color:var(--mute);margin:0 0 12px;font-weight:600}
  .now{font-size:13px;line-height:1.6}
  .now b{color:var(--run)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px;font-size:12.5px;color:var(--mute)}
  .legend b{color:var(--text)}
  .grid35{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .cell{height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;transition:background .8s}
  .cell.ok{background:#3fb95033;color:var(--ok);border:1px solid #3fb95088}
  .cell.bad{background:#f8514922;color:var(--bad);border:1px solid #f8514988}
  .cell.run{background:#58a6ff22;color:var(--run);border:1px solid #58a6ff88;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px #58a6ff22}}
  .phase{border-bottom:1px solid #21262d;padding:12px 0}
  .phase:last-child{border-bottom:0}
  .ph-head{display:grid;grid-template-columns:28px 1fr 200px 48px;gap:10px;align-items:center;cursor:pointer}
  .ph-head .nm{font-size:14px;font-weight:600}
  .ph-head .nm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
  .pct{text-align:right;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:4px;background:#21262d;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .bar>i.ok{background:var(--ok)}
  .bar>i.run{background:repeating-linear-gradient(45deg,#58a6ff 0 8px,#3b82d6 8px 16px);background-size:22.6px 22.6px;animation:slide 1s linear infinite}
  .bar>i.wait{background:#30363d}
  @keyframes slide{to{background-position:22.6px 0}}
  .items{margin:8px 0 0 38px;display:grid;gap:3px}
  .it{display:flex;gap:8px;align-items:center;font-size:12.8px;color:var(--mute)}
  .it.ok{color:#c9d1d9}.it.run{color:var(--text)}
  .it .note{margin-left:auto;font-size:11.5px;color:var(--mute);text-align:right;max-width:45%}
  .spin{animation:spin 1.3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .log{font-size:12.3px;display:grid;gap:6px;max-height:320px;overflow:auto}
  .log div{border-left:2px solid #30363d;padding-left:8px}
  .log time{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px}
  .err{color:var(--warn);font-size:12px}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .halt{display:none;margin:10px 0 0;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.6;border:1px solid}
  .halt.stopped{display:block;background:rgba(220,60,60,.12);border-color:rgba(220,60,60,.55);color:#ff9a9a}
  .halt.stale{display:block;background:rgba(230,160,40,.12);border-color:rgba(230,160,40,.55);color:#ffc870}
  .halt b{font-weight:700}
</style>
</head>
<body>
<div class="halt" id="halt"></div>
<header>
  <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l10 6v12l-10 6-10-6V9z" fill="none" stroke="#58a6ff" stroke-width="2"/><path d="M5 9l10 6 10-6M15 15v12" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity=".6"/></svg>
  <div>
    <h1>STEP 35/35 可編輯特徵化</h1>
    <div class="sub">D:\3DB實機確認 全部目標 → 原生可編輯特徵樹 · 驗收門檻 1e-6、原子拒絕、不放寬</div>
  </div>
  <div class="right">
    <span id="updated">讀取中…</span> <span id="beat" style="color:#8b949e;margin-left:10px"></span>
    <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#21262d" stroke-width="3"/><circle id="cd-ring" cx="17" cy="17" r="14" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" transform="rotate(-90 17 17)" stroke-dasharray="87.96" stroke-dashoffset="0"/><text id="cd-text" x="17" y="21" text-anchor="middle" font-size="11" fill="#e6edf3">30</text></svg>
  </div>
</header>
<main>
  <div class="col">
    <section class="panel">
      <h2>整體開發進度</h2>
      <svg width="340" height="290" viewBox="0 0 340 290">
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs>
        <g id="ticks"></g>
        <circle cx="170" cy="145" r="115" fill="none" stroke="#21262d" stroke-width="18"/>
        <circle id="g-arc" cx="170" cy="145" r="115" fill="none" stroke="url(#gg)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 170 145)" stroke-dasharray="722.6" stroke-dashoffset="722.6" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/>
        <circle cx="170" cy="145" r="92" fill="none" stroke="#21262d" stroke-width="7"/>
        <circle id="g-t" cx="170" cy="145" r="92" fill="none" stroke="#3fb950" stroke-width="7" stroke-linecap="round" transform="rotate(-90 170 145)" stroke-dasharray="578" stroke-dashoffset="578" style="transition:stroke-dashoffset 1.4s"/>
        <g id="orbit" class="spin" style="transform-origin:170px 145px"><circle cx="170" cy="30" r="4.5" fill="#58a6ff"/></g>
        <text id="g-pct" x="170" y="140" text-anchor="middle" font-size="50" font-weight="700" fill="#e6edf3">0%</text>
        <text id="g-sub" x="170" y="166" text-anchor="middle" font-size="13" fill="#8b949e"></text>
        <text id="g-t-txt" x="170" y="186" text-anchor="middle" font-size="12" fill="#3fb950"></text>
      </svg>
      <div class="legend"><span>外圈：開發細項完成度</span><span>內圈：可編輯目標 / 35</span></div>
    </section>
    <section class="panel">
      <h2>目前在做</h2>
      <div class="now" id="now">—</div>
    </section>
    <section class="panel">
      <h2>35 個目標（綠：可編輯　紅：尚未　藍：處理中）</h2>
      <div class="grid35" id="grid"></div>
      <div class="legend" id="tlist" style="grid-template-columns:1fr;margin-top:10px"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel">
      <h2>開發階段與細項</h2>
      <div id="phases"></div>
      <div class="err" id="err"></div>
    </section>
    <section class="panel">
      <h2>開發紀錄</h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>
<script>
const INTERVAL=30;let countdown=INTERVAL,data=null;
const $=id=>document.getElementById(id);
const tl=t=>new Date(t*1000).toLocaleTimeString('zh-TW',{hour12:false});
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} 小時 ${m} 分`:`${m} 分 ${s%60} 秒`};
(()=>{let g='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?133:129,r2=139;g+=`<line x1="${170+r1*Math.sin(a)}" y1="${145-r1*Math.cos(a)}" x2="${170+r2*Math.sin(a)}" y2="${145-r2*Math.cos(a)}" stroke="${i%5?'#30363d':'#484f58'}" stroke-width="${i%5?1:2}"/>`}$('ticks').innerHTML=g})();
function icon(st,r=9){const s=r*2+4,c=s/2;
  if(st==='ok')return `<svg width="${s}" height="${s}"><circle cx="${c}" cy="${c}" r="${r}" fill="#3fb95022" stroke="#3fb950"/><path d="M${c-r*.45} ${c} l${r*.32} ${r*.35} l${r*.6} ${-r*.7}" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/></svg>`;
  if(st==='run')return `<svg width="${s}" height="${s}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#21262d" stroke-width="2.5"/><circle class="spin" style="transform-origin:${c}px ${c}px" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="${r*2} ${r*5}" stroke-linecap="round"/></svg>`;
  if(st==='bad')return `<svg width="${s}" height="${s}"><circle cx="${c}" cy="${c}" r="${r}" fill="#f8514922" stroke="#f85149"/><path d="M${c-r*.4} ${c-r*.4}l${r*.8} ${r*.8}M${c+r*.4} ${c-r*.4}l${-r*.8} ${r*.8}" stroke="#f85149" stroke-width="2" stroke-linecap="round"/></svg>`;
  return `<svg width="${s}" height="${s}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#6e7681" stroke-dasharray="3 3"/></svg>`}
function render(){
  if(!data)return;
  let tot=0,done=0;
  for(const p of data.phases)for(const it of p.items){tot++;if(it.st==='ok')done++;else if(it.st==='run')done+=it.frac??.4}
  const pct=done/Math.max(tot,1);
  $('g-arc').style.strokeDashoffset=(722.6*(1-pct)).toFixed(1);
  $('g-pct').textContent=Math.round(pct*100)+'%';
  $('g-sub').textContent=`${data.phases.reduce((a,p)=>a+p.items.filter(i=>i.st==='ok').length,0)} / ${tot} 細項完成`;
  const okT=data.targets.filter(t=>t.st==='ok').length;
  $('g-t').style.strokeDashoffset=(578*(1-okT/35)).toFixed(1);
  $('g-t-txt').textContent=`可編輯 ${okT} / 35`;
  { // what is being done: the line the work set, and when; the newest log line under it when that is newer
    const L=(data.log||[])[data.log.length-1], nt=data.nowT;
    $('now').innerHTML=(data.now||'—')+(nt?` <span style="color:#8b949e;font-size:13px">（${tl(nt)}）</span>`:'')+(L&&(!nt||L.t>nt)?`<div style="color:#8b949e;font-size:13px;margin-top:6px">最新：${tl(L.t)} ${L.m}</div>`:''); }
  { // whether the work stopped: told by the run itself (run.state), or inferred when nothing was written for STALE minutes
    const STALE=8, h=$('halt'), age=(Date.now()/1000-(data.updated||0))/60, run=data.run||{};
    // is the work going on? Progress written within STALE minutes says so by itself; the heartbeat (beat.js, livebeat.mjs) only adds to it, and a
    // heartbeat that stopped is reported as the heartbeat stopping, not as the work stopping
    const nowS=Date.now()/1000, B=window.BEAT, bFresh=!!(B&&B.alive&&(nowS-B.t)/60<2), pFresh=age<=STALE;
    const acts=[B&&B.activity,data.activity].filter(a=>a&&a.t).sort((a,b)=>b.t-a.t), A=acts[0];
    const act=A?`最近檔案變動 ${Math.max(0,Math.round((nowS-A.t)/60))} 分鐘前（${A.f}）`:'';
    const aFresh=!!(A&&(nowS-A.t)/60<=STALE), alive=run.state!=='stopped'&&(pFresh||aFresh);
    $('beat').textContent=(alive?'CLI 執行中':run.state==='stopped'?'CLI 已停止':'CLI 狀態不明')+(act?' · '+act:'')+(bFresh?'':B?` · 檔案活動未即時（心跳最後 ${tl(B.t)}，下次進度更新時自動重啟）`:' · 檔案活動未即時（下次進度更新時啟動心跳）');
    if(run.state==='stopped'&&!(bFresh&&B.t>(run.t||0))){h.className='halt stopped';h.innerHTML=`<b>工作已停止</b>（${tl(run.t||data.updated)}）：${run.why||''}`}
    else if(B&&!B.alive&&/CLI/.test(B.why||'')&&B.t>(data.updated||0)){h.className='halt stopped';h.innerHTML=`<b>CLI 已結束</b>（${tl(B.t)}）：進度最後更新於 ${tl(data.updated)}`}
    else if(!pFresh){const recent=A&&(nowS-A.t)/60<=STALE;h.className='halt stale';h.innerHTML=recent?`<b>進度 ${Math.round(age)} 分鐘沒有更新</b>，但檔案仍在變動：${act}`:`<b>可能已中斷</b>：進度 ${Math.round(age)} 分鐘、檔案 ${A?Math.round((nowS-A.t)/60):'?'} 分鐘沒有變動`}
    else{h.className='halt';h.innerHTML=''}
  }
  $('grid').innerHTML=data.targets.map((t,i)=>`<div class="cell ${t.st}" title="${t.name}">${i+1}</div>`).join('');
  $('tlist').innerHTML=data.targets.filter(t=>t.st!=='ok').map(t=>`<span>${icon(t.st,6)} ${data.targets.indexOf(t)+1}. ${t.name} <span style="color:#6e7681">${t.note||''}</span></span>`).join('');
  const box=$('phases');
  if(box.children.length!==data.phases.length)box.innerHTML=data.phases.map(()=>`<div class="phase"><div class="ph-head"><span class="ic"></span><div class="nm"></div><div class="bar"><i></i></div><div class="pct"></div></div><div class="items"></div></div>`).join('');
  data.phases.forEach((p,k)=>{
    const el=box.children[k];
    const n=p.items.length,d=p.items.reduce((a,i)=>a+(i.st==='ok'?1:i.st==='run'?(i.frac??.4):0),0);
    const st=p.items.every(i=>i.st==='ok')?'ok':p.items.some(i=>i.st!=='wait')?'run':'wait';
    if(el.dataset.st!==st){el.querySelector('.ic').innerHTML=icon(st,10);el.dataset.st=st}
    el.querySelector('.nm').innerHTML=`${p.name}<small>${p.sub||''}</small>`;
    const b=el.querySelector('.bar>i');b.className=st;requestAnimationFrame(()=>{b.style.width=(100*d/n).toFixed(1)+'%'});
    el.querySelector('.pct').textContent=Math.round(100*d/n)+'%';
    const its=el.querySelector('.items');
    if(its.children.length!==n)its.innerHTML=p.items.map(()=>`<div class="it"><span class="ic"></span><span class="tx"></span><span class="note"></span></div>`).join('');
    p.items.forEach((it,j)=>{const e=its.children[j];e.className='it '+it.st;if(e.dataset.st!==it.st){e.querySelector('.ic').innerHTML=icon(it.st,6);e.dataset.st=it.st}e.querySelector('.tx').textContent=it.t;e.querySelector('.note').textContent=it.note||''});
  });
  $('log').innerHTML=(data.log||[]).slice().reverse().map(l=>`<div><time>${tl(l.t)}</time>${l.m}</div>`).join('');
  $('orbit').style.display=okT===35?'none':'';
}
function loadBeat(){const o=document.getElementById('beatjs');if(o)o.remove();const s=document.createElement('script');s.id='beatjs';s.src='beat.js?t='+Date.now();s.onload=()=>{if(data)render()};s.onerror=()=>{window.BEAT=undefined};document.head.appendChild(s)}
function load(){loadBeat();const o=document.getElementById('data');if(o)o.remove();const s=document.createElement('script');s.id='data';s.src='data.js?t='+Date.now();
  s.onload=()=>{data=window.DEV;$('err').textContent='';$('updated').textContent=`資料更新於 ${tl(data.updated)} · 開工 ${fmt(Date.now()/1000-data.started)}`;render()};
  s.onerror=()=>{$('err').textContent='讀不到 data.js'};document.head.appendChild(s)}
setInterval(()=>{countdown--;if(countdown<=0){countdown=INTERVAL;load()}$('cd-text').textContent=countdown;$('cd-ring').style.strokeDashoffset=(87.96*(1-countdown/INTERVAL)).toFixed(2)},1000);
load();
</script>
</body>
</html>
