[package]
name = "desktop"
version = "0.7.0"
description = "3D-Builder desktop shell: the web app in a native window"
edition = "2021"
default-run = "desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
